services:
  - type: web
    name: jaldrishti-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DEPLOYMENT_MODE
        value: cloud
      - key: PUBLIC_ORIGINS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUSH_CONTACT_EMAIL
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: FORWARDED_ALLOW_IPS
        value: '*'
